name: Approve parked CI
description: >
  Gets the pull_request runs a CI-opened PR needs onto the PR. GitHub parks them
  at conclusion action_required when the PR is opened with GITHUB_TOKEN, and
  sometimes creates none at all. Either way the ruleset on the default branch
  sees no check and the PR sits unmergeable.

# Lifted from react-native-magic-modal, which wrote it against real incidents
# (PRs #251, #256, #260, #264 there). The portfolio repo had a 42-line variant
# that approved only the first parked run and exited 0 on failure; this one wins
# because a repo with two pull_request workflows needs all of them released, and
# a silent success on an unmergeable PR is the failure mode it was written for.
#
# The two hard-coded bits of that original — the git identity used for the
# amend, and the trailing message — are inputs now.

inputs:
  pull-request:
    description: Number of the pull request whose runs should be released.
    required: true
  token:
    description: Token with actions:write and pull-requests:write on this repository.
    required: true
  attempts:
    description: How many times to re-push the head before giving up.
    required: false
    default: "3"
  git-user-name:
    description: Author of the empty amend used to re-fire `synchronize`.
    required: false
    default: Gabriel Taveira
  git-user-email:
    description: Email of the author of the amend.
    required: false
    default: gabrielstaveira@gmail.com
  comment-on-failure:
    description: Leave a PR comment explaining the admin merge when every attempt fails.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ inputs.pull-request }}
        ATTEMPTS: ${{ inputs.attempts }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        COMMENT_ON_FAILURE: ${{ inputs.comment-on-failure }}
      run: |
        set -euo pipefail

        runs_for() {
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$1" \
            --jq '.workflow_runs[] | "\(.id) \(.conclusion // "none")"'
        }

        branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)

        for attempt in $(seq 1 "$ATTEMPTS"); do
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "attempt $attempt/$ATTEMPTS: #$PR is at $sha on $branch"

          # The runs list is indexed a little behind the events, and a head_sha
          # query has come back empty for a run whose check suite was already
          # in_progress. Two minutes is well past that.
          found=""
          for _ in $(seq 1 20); do
            found=$(runs_for "$sha")
            [ -n "$found" ] && break
            sleep 6
          done

          if [ -n "$found" ]; then
            echo "$found"
            # A parked run carries conclusion action_required. Approve every one:
            # a repo can have several workflows on pull_request, and the ruleset
            # waits on all of their contexts.
            while read -r id conclusion; do
              [ "$conclusion" = "action_required" ] || continue
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
              echo "approved run $id"
            done <<< "$found"
            exit 0
          fi

          [ "$attempt" = "$ATTEMPTS" ] && break

          # No run exists for this sha, so GitHub dropped the pull_request event.
          # It does the same to human-opened PRs occasionally.
          #
          # A new head sha fires synchronize and gets a fresh set. Re-running the
          # workflow by dispatch would not: a workflow_dispatch suite has no PR
          # attached, so the ruleset never counts it.
          head=$(git rev-parse HEAD)
          if [ "$head" != "$sha" ]; then
            echo "::warning::HEAD is $head but the PR head is $sha, so there is nothing safe to re-push."
            break
          fi
          echo "no pull_request run for $sha, amending to move the head and fire synchronize"
          git -c "user.email=$GIT_USER_EMAIL" -c "user.name=$GIT_USER_NAME" \
            commit --amend --no-edit --allow-empty
          git push --force origin "HEAD:refs/heads/$branch"
          sleep 10
        done

        echo "::error::No pull_request run ever attached to #$PR after $ATTEMPTS tries. The required check cannot report, so this needs an admin merge."
        if [ "$COMMENT_ON_FAILURE" = "true" ]; then
          gh pr comment "$PR" --body "$(printf '%s\n' \
            "GitHub never created a pull_request run for this PR, across $ATTEMPTS tries and the forced head moves in between." \
            "" \
            "The context the ruleset on the default branch requires has nothing to report, so auto-merge will wait forever." \
            "This one needs \`gh pr merge --admin\`. Run ${GITHUB_RUN_ID} has the detail.")"
        fi
        exit 1
