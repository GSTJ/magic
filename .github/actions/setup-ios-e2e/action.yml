name: Setup iOS E2E (Xcode + Maestro + simulator)
description: >
  Everything a macOS runner needs before it can build an Expo app and drive it
  with Maestro: an Xcode selection, a pinned and cached Maestro, CocoaPods,
  the two native caches worth having, and a booted simulator.
  Consume it as GSTJ/magic/.github/actions/setup-ios-e2e@v1.

# Three repos do this today and every sub-step is implemented three different
# ways — unpinned `curl | bash` Maestro in two of them, three different Xcode
# selections, three different simulator pickers, two JDKs. The defaults here are
# the pinned-and-cached ones, because those are the ones that were debugged.
#
# Node/pnpm is a separate concern: run GSTJ/magic/.github/actions/setup@v1 as
# well. Checkout stays with the caller, as always.
#
# Out of scope on purpose: @expo/fingerprint bundle-swap caching. That is ~260
# lines of repo-specific logic with a liveness-probe fallback, and generalising
# it is its own project.

inputs:
  xcode-version:
    description: >
      latest for the newest installed Xcode, a prefix like "26" for the newest
      matching one, an exact "16.4", or empty to leave the runner default alone.
    required: false
    default: latest
  maestro-version:
    description: Maestro version to install. Pinned, and cached at ~/.maestro.
    required: false
    default: 2.6.0
  simulator-device:
    description: >
      Simulator device name. Empty takes the newest iPhone the chosen runtime
      supports, ranked by generation and then Pro Max > Pro > Plus > plain >
      mini — a runtime lists its device types in Apple order, and taking the
      last one lands on an iPhone 11. Pin a name only when a flow depends on a
      particular screen size.
    required: false
    default: ""
  simulator-runtime:
    description: 'Runtime prefix, e.g. "iOS 26". Empty takes the newest installed.'
    required: false
    default: ""
  simulator-fallback:
    description: >
      When the pinned device/runtime pair is not on the runner, use the newest
      iPhone on the newest iOS runtime instead of failing. Runner images drop
      runtimes without warning, so this is on by default and warns loudly.
    required: false
    default: "true"
  boot:
    description: >
      Boot the simulator and wait for it. Set it to false when the build runs
      next — `simctl boot` returns as soon as the boot starts, so starting it and
      waiting for it in two different places is what lets the boot overlap the
      compile, which is the one place the overlap is free.
    required: false
    default: "true"
  boot-timeout-seconds:
    description: >
      How long to wait for a boot before erasing the device and trying once more.
      `simctl bootstatus -b` never returns on a device that wedged, and an
      unbounded wait eats the whole job timeout at 10x macOS billing.
    required: false
    default: "240"
  create-device:
    description: >
      auto | true | false. true creates a dedicated device from the newest
      runtime's own supportedDeviceTypes — the only pairing `simctl create`
      accepts — after deleting any left over from an earlier run under the same
      name. auto is true off a GitHub-hosted runner and false on one: a hosted
      runner is destroyed after the job, so creating there only costs a boot,
      while a self-hosted Mac accumulates one full disk image per run.
    required: false
    default: auto
  device-name:
    description: Name for the created device. Also what the stale-device sweep matches on.
    required: false
    default: magic-e2e
  install-cocoapods:
    description: auto uses the runner's pod if there is one, true always installs, false never.
    required: false
    default: auto
  ruby-version:
    description: Ruby to install CocoaPods against. Empty uses the runner's Ruby.
    required: false
    default: ""
  cache-maestro:
    description: >
      auto | true | false. Cache ~/.maestro through actions/cache. auto is true
      on a GitHub-hosted runner and false anywhere else, and the asymmetry is
      the point: the directory is 332 MB (3m51 to upload cold), and on a
      self-hosted Mac ~/.maestro is the login user's real install, with their
      `maestro test` history under it. Restoring a cache over that replaces a
      working install with CI's copy and drops a stale run history on the
      machine, to save a download the runner never has to do — it kept its disk.
    required: false
    default: auto
  cache-pods:
    description: Cache ~/.cocoapods and ~/Library/Caches/CocoaPods.
    required: false
    default: "true"
  cache-derived-data:
    description: Cache ~/Library/Developer/Xcode/DerivedData.
    required: false
    default: "true"
  cache-key-file:
    description: >
      File whose hash keys the native caches. Empty resolves to the first of
      ios/Podfile.lock, Podfile.lock, pnpm-lock.yaml that exists.
    required: false
    default: ""
  working-directory:
    description: Directory holding the app (where ios/Podfile.lock is looked for).
    required: false
    default: "."
  java-version:
    description: Java version for setup-java. Empty skips it — iOS does not need one.
    required: false
    default: ""

outputs:
  udid:
    description: UDID of the simulator that was selected (and booted, unless boot was false).
    value: ${{ steps.simulator.outputs.udid }}
  simulator-name:
    description: Name and runtime of the simulator that was selected.
    value: ${{ steps.simulator.outputs.name }}
  created:
    description: >
      "true" when this action created the device, so the caller knows to delete
      it on the way out. A step output of a composite action is invisible to the
      caller unless it is declared here.
    value: ${{ steps.simulator.outputs.created }}
  xcode-path:
    description: Developer directory that xcode-select now points at.
    value: ${{ steps.xcode.outputs.path }}
  maestro-version:
    description: Maestro version on PATH.
    value: ${{ steps.maestro.outputs.version }}

runs:
  using: composite
  steps:
    - name: 🍎 Select Xcode
      id: xcode
      if: inputs.xcode-version != ''
      shell: bash
      env:
        WANT: ${{ inputs.xcode-version }}
      run: |
        set -euo pipefail
        installed=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sed 's|.*/Xcode_||;s|\.app$||' | sort -V || true)
        if [ -z "$installed" ]; then
          echo "::warning::No /Applications/Xcode_*.app on this runner; keeping the default toolchain."
          echo "path=$(xcode-select -p)" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          exit 0
        fi
        if [ "$WANT" = "latest" ]; then
          pick=$(echo "$installed" | tail -1)
        else
          # Exact first, then newest with that prefix, so "26" matches 26.0.1.
          pick=$(echo "$installed" | grep -Fx "$WANT" || true)
          [ -n "$pick" ] || pick=$(echo "$installed" | grep "^${WANT}" | tail -1 || true)
        fi
        if [ -z "$pick" ]; then
          echo "::error::No Xcode matching '$WANT'. Installed: $(echo "$installed" | tr '\n' ' ')"
          exit 1
        fi
        developer="/Applications/Xcode_${pick}.app/Contents/Developer"
        echo "Selecting Xcode $pick"
        sudo xcode-select -s "$developer"
        echo "path=$developer" >> "$GITHUB_OUTPUT"
        xcodebuild -version

    - name: ☕️ Setup Java
      if: inputs.java-version != ''
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: 🔑 Resolve native cache key
      id: keys
      shell: bash
      env:
        IN_CACHE_KEY_FILE: ${{ inputs.cache-key-file }}
        IN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        wd="${IN_WORKING_DIRECTORY:-.}"
        wd="${wd%/}"
        [ -n "$wd" ] || wd="."
        under() { if [ "$wd" = "." ]; then printf '%s' "$1"; else printf '%s/%s' "$wd" "$1"; fi; }

        file="$IN_CACHE_KEY_FILE"
        if [ -z "$file" ]; then
          for candidate in "$(under ios/Podfile.lock)" "$(under Podfile.lock)" "$(under pnpm-lock.yaml)" pnpm-lock.yaml; do
            if [ -f "$candidate" ]; then file="$candidate"; break; fi
          done
        fi
        if [ -n "$file" ] && [ -f "$file" ]; then
          hash=$(shasum -a 256 "$file" | cut -c1-16)
          echo "Keying native caches on $file ($hash)"
        else
          # No stable input to key on. A date bucket still beats a cold runner
          # every time and cannot serve a stale Pods tree for long.
          hash="nokey-$(date -u +%Y%m)"
          echo "::warning::No Podfile.lock or pnpm-lock.yaml to key the native caches on; falling back to $hash."
        fi
        echo "working-directory=$wd" >> "$GITHUB_OUTPUT"
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: 🗄 Cache Maestro
      # `runner.environment`, not `env.RUNNER_ENVIRONMENT`: the env context holds
      # what a workflow set, not the runner's own variables. The shell steps use
      # $RUNNER_ENVIRONMENT because there the process environment is all there is.
      if: >-
        inputs.cache-maestro == 'true'
        || (inputs.cache-maestro == 'auto' && runner.environment == 'github-hosted')
      uses: actions/cache@v6
      with:
        path: ~/.maestro
        key: maestro-${{ runner.os }}-${{ inputs.maestro-version }}

    - name: 🤖 Install Maestro
      id: maestro
      shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.maestro-version }}
      run: |
        set -euo pipefail
        if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
        fi
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        # tail, not head: it drains its input, so the writer never takes a
        # SIGPIPE that pipefail would turn into this step's exit code.
        version=$("$HOME/.maestro/bin/maestro" --version | tail -1)
        echo "maestro $version"
        # An install already on the runner is used as-is rather than overwritten
        # — off a hosted runner it is the machine owner's, not CI's. Say so when
        # it is not the pinned version, because otherwise the version a run used
        # is decided by whatever that machine happens to have.
        case "$version" in
          *"$MAESTRO_VERSION"*) ;;
          *) echo "::warning::maestro $version is already installed at ~/.maestro and is what this run will use, not the pinned $MAESTRO_VERSION. Remove ~/.maestro on this runner, or change maestro-version to match." ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: 🗄 Cache CocoaPods specs and sources
      if: inputs.cache-pods == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cocoapods
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-pods-${{ steps.keys.outputs.hash }}
        restore-keys: ${{ runner.os }}-pods-

    - name: 🗄 Cache DerivedData
      if: inputs.cache-derived-data == 'true'
      uses: actions/cache@v6
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-deriveddata-${{ steps.keys.outputs.hash }}
        restore-keys: ${{ runner.os }}-deriveddata-

    - name: 💎 Setup Ruby
      if: inputs.ruby-version != '' && inputs.install-cocoapods != 'false'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: false

    - name: 📦 Install CocoaPods
      if: inputs.install-cocoapods != 'false'
      shell: bash
      env:
        MODE: ${{ inputs.install-cocoapods }}
      run: |
        set -euo pipefail
        if [ "$MODE" = "auto" ] && command -v pod >/dev/null 2>&1; then
          echo "Using the runner's CocoaPods: $(pod --version)"
          exit 0
        fi
        gem install cocoapods --no-document
        pod --version

    - name: 📱 Select simulator
      id: simulator
      shell: bash
      env:
        SIM_DEVICE: ${{ inputs.simulator-device }}
        SIM_RUNTIME: ${{ inputs.simulator-runtime }}
        SIM_FALLBACK: ${{ inputs.simulator-fallback }}
        SIM_CREATE: ${{ inputs.create-device }}
        SIM_NAME: ${{ inputs.device-name }}
      run: |
        set -euo pipefail

        create="$SIM_CREATE"
        if [ "$create" = "auto" ]; then
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then create=false; else create=true; fi
        fi

        if [ "$create" = "true" ]; then
          # A self-hosted Mac is not destroyed after the job, and a device from
          # an earlier run is still sitting there with a full disk image behind
          # it. Sweep before creating, so a cancelled run cannot leave the
          # machine slowly filling up; the caller tears this one down on the way
          # out, and this sweep only ever has to catch runs that were killed.
          stale_list="${RUNNER_TEMP:-/tmp}/magic-stale-simulators.txt"
          xcrun simctl list devices --json | python3 -c '
        import json, os, sys
        want = os.environ["SIM_NAME"]
        for entries in json.load(sys.stdin)["devices"].values():
            for device in entries:
                if device.get("name") == want and device.get("udid"):
                    print(device["udid"])
        ' > "$stale_list"
          while read -r stale; do
            [ -n "$stale" ] || continue
            echo "Removing leftover simulator $stale"
            xcrun simctl shutdown "$stale" 2>/dev/null || true
            xcrun simctl delete "$stale" 2>/dev/null || true
          done < "$stale_list"

          # Pick the runtime first, then a device type that runtime actually
          # lists. Choosing the newest runtime and the newest iPhone
          # independently pairs combinations `simctl create` rejects.
          pair=$(xcrun simctl list runtimes --json | python3 -c '
        import json, os, re, sys

        want_runtime = os.environ.get("SIM_RUNTIME", "").strip()
        want_device = os.environ.get("SIM_DEVICE", "").strip()
        fallback = os.environ.get("SIM_FALLBACK") == "true"

        def order(runtime):
            match = re.search(r"iOS[- ](\d+)(?:[-.](\d+))?", runtime.get("identifier", ""))
            return (int(match.group(1)), int(match.group(2) or 0)) if match else (0, 0)

        def phone_order(device):
            name = device.get("name", "")
            match = re.search(r"iPhone\s+(\d+)", name)
            generation = int(match.group(1)) if match else 0
            lowered = name.lower()
            if "pro max" in lowered:
                rank = 3
            elif "pro" in lowered:
                rank = 2
            elif "plus" in lowered:
                rank = 1
            elif "mini" in lowered:
                rank = -1
            else:
                rank = 0
            return (generation, rank, name)

        available = [
            runtime
            for runtime in json.load(sys.stdin)["runtimes"]
            if runtime.get("platform") == "iOS" and runtime.get("isAvailable")
        ]
        matching = [r for r in available if not want_runtime or r.get("name", "").startswith(want_runtime)]
        pool = matching or (available if fallback else [])
        if not pool:
            sys.exit(1)
        runtime = sorted(pool, key=order)[-1]

        phones = [
            device
            for device in runtime.get("supportedDeviceTypes", [])
            if device.get("productFamily") == "iPhone"
        ]
        named = [device for device in phones if device.get("name") == want_device]
        chosen = named or (phones if (fallback or not want_device) else [])
        if not chosen:
            sys.exit(1)
        # supportedDeviceTypes comes back in the order Apple ships it, which
        # is not newest last: taking the final entry picked an iPhone 11 off an
        # iOS 26 runtime. Sorting by name string is no better either, because
        # "iPhone 9" beats "iPhone 17" as a string.
        device = sorted(chosen, key=phone_order)[-1]
        print(device["identifier"], runtime["identifier"], device["name"], runtime["name"], sep="|")
        ') || true

          if [ -z "$pair" ]; then
            echo "::error::No iPhone device type on any installed iOS runtime matches device='$SIM_DEVICE' runtime='$SIM_RUNTIME'."
            xcrun simctl list runtimes
            exit 1
          fi
          device_type=${pair%%|*}; rest=${pair#*|}
          runtime_id=${rest%%|*}; rest=${rest#*|}
          device_name=${rest%%|*}; runtime_name=${rest#*|}

          udid=$(xcrun simctl create "$SIM_NAME" "$device_type" "$runtime_id")
          name="$device_name ($runtime_name)"
          echo "Created $SIM_NAME: $name — $udid"
        else
          selection=$(xcrun simctl list devices available --json | python3 -c '
        import json, os, re, sys

        want_name = os.environ.get("SIM_DEVICE", "").strip()
        want_runtime = os.environ.get("SIM_RUNTIME", "").strip()
        fallback = os.environ.get("SIM_FALLBACK") == "true"
        devices = json.load(sys.stdin)["devices"]

        def phone_order(name):
            match = re.search(r"iPhone\s+(\d+)", name)
            generation = int(match.group(1)) if match else 0
            lowered = name.lower()
            if "pro max" in lowered:
                rank = 3
            elif "pro" in lowered:
                rank = 2
            elif "plus" in lowered:
                rank = 1
            elif "mini" in lowered:
                rank = -1
            else:
                rank = 0
            return (generation, rank, name)

        def ios_runtimes():
            for runtime, entries in devices.items():
                match = re.search(r"iOS-(\d+)(?:-(\d+))?", runtime)
                if not match:
                    continue
                major = int(match.group(1))
                minor = int(match.group(2) or 0)
                yield (major, minor), f"iOS {major}", entries

        exact = []
        any_iphone = []
        for order, label, entries in ios_runtimes():
            for device in entries:
                name = device.get("name", "")
                udid = device.get("udid")
                if not udid:
                    continue
                # Sort key first, so the newest runtime wins and, within it,
                # the newest iPhone — "iPhone 9" sorts above "iPhone 17" as a
                # string, which is how a picker like this ends up on an SE.
                if "iPhone" in name:
                    any_iphone.append(((order, phone_order(name)), name, label, udid))
                if want_name and name != want_name:
                    continue
                if want_runtime and not label.startswith(want_runtime):
                    continue
                exact.append(((order, phone_order(name)), name, label, udid))

        pool = exact or (any_iphone if fallback else [])
        if not pool:
            sys.exit(1)
        pool.sort()
        _, name, label, udid = pool[-1]
        print(udid, f"{name} ({label})", "exact" if exact else "fallback", sep="|")
        ') || true

          if [ -z "$selection" ]; then
            echo "::error::No simulator matching device='$SIM_DEVICE' runtime='$SIM_RUNTIME'."
            xcrun simctl list devices available
            exit 1
          fi
          udid=${selection%%|*}; rest=${selection#*|}
          name=${rest%%|*}; how=${rest#*|}
          if [ "$how" = "fallback" ]; then
            echo "::warning::No simulator matched device='$SIM_DEVICE' runtime='$SIM_RUNTIME'; using $name."
          fi
          echo "Simulator: $name ($udid)"
        fi

        {
          echo "udid=$udid"
          echo "name=$name"
          echo "created=$create"
        } >> "$GITHUB_OUTPUT"

    # `simctl boot` returns as soon as the boot starts; only `bootstatus` blocks.
    # With boot=false the caller starts it here and waits later — against the
    # compile, which is the one placement that was measured to help. Booting
    # before `pnpm install` slowed Setup Node from 29s to 249s; waiting for it
    # after the build left the device booted but not settled and the flows went
    # from 245s to 457s. Overlapping the compile got them to 165s.
    - name: 📱 Boot the simulator
      id: boot
      shell: bash
      env:
        UDID: ${{ steps.simulator.outputs.udid }}
        SIM_BOOT: ${{ inputs.boot }}
        BOOT_TIMEOUT: ${{ inputs.boot-timeout-seconds }}
      run: |
        set -euo pipefail

        xcrun simctl boot "$UDID" || true
        if [ "$SIM_BOOT" != "true" ]; then
          echo "Boot started; nothing waits for it here."
          exit 0
        fi

        wait_for_boot() {
          xcrun simctl bootstatus "$UDID" -b &
          local pid=$! waited=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 5
            waited=$((waited + 5))
            if [ "$waited" -ge "$1" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              return 1
            fi
          done
          wait "$pid"
        }

        if ! wait_for_boot "$BOOT_TIMEOUT"; then
          echo "::warning::Simulator did not finish booting in ${BOOT_TIMEOUT}s; erasing and booting it again."
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID" 2>/dev/null || true
          xcrun simctl boot "$UDID"
          wait_for_boot "$BOOT_TIMEOUT" || {
            echo "::error::Simulator $UDID never booted."
            xcrun simctl list devices
            exit 1
          }
        fi
        echo "Booted $UDID"
