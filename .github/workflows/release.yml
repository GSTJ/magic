name: 🚀 Release

# Reusable npm publish workflow, driven by changesets-free conventional commits
# via release-it. Callers own their `.release-it.js`; this workflow only handles
# checkout, install, auth and running the release command.
#
#   jobs:
#     release:
#       uses: GSTJ/magic/.github/workflows/release.yml@v1
#       secrets:
#         NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
#       permissions:
#         contents: write
#         id-token: write
#
# This repo does not publish itself through this workflow — its packages ship
# from self-release.yml, which also moves the tags consumers reference.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: ""
      node-version-file:
        type: string
        required: false
        default: ".nvmrc"
      pnpm-version:
        type: string
        required: false
        default: ""
      working-directory:
        type: string
        required: false
        default: "."
      install-command:
        type: string
        required: false
        default: "pnpm install --frozen-lockfile"
      build-command:
        type: string
        required: false
        default: "pnpm run build"
      release-command:
        description: "The command that actually publishes. Defaults to release-it in CI mode."
        type: string
        required: false
        default: "pnpm run release"
      git-user-name:
        type: string
        required: false
        default: "Gabriel Taveira"
      git-user-email:
        type: string
        required: false
        default: "gabrielstaveira@gmail.com"
      runs-on:
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      NPM_TOKEN:
        required: true
      GH_PAT:
        description: "Optional PAT so the version-bump commit can push past branch protection."
        required: false

jobs:
  release:
    name: 🎉 Publish
    # release-it writes "[skip ci]" with a space. Matching "[skip-ci]" never fires.
    if: "!contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    # Two quick pushes to main must not run two releases in parallel — they
    # race the version-bump push and the npm publish. Queue, never cancel: a
    # cancelled half-release can leave a tag with no published package.
    concurrency:
      group: magic-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # release tooling needs history to find the last tag.
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: true

      # `$/` keeps the action on the same commit as this reusable workflow.
      - name: 🏗 Setup Node + pnpm
        uses: $/.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          pnpm-version: ${{ inputs.pnpm-version }}
          working-directory: ${{ inputs.working-directory }}
          install-command: ${{ inputs.install-command }}
          # This job publishes, so the .npmrc is wanted here.
          registry-url: "https://registry.npmjs.org"
          node-auth-token: ${{ secrets.NPM_TOKEN }}

      - name: 🏗 Build
        if: inputs.build-command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: 🚀 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_COMMAND: ${{ inputs.release-command }}
        run: |
          git config --global user.email "$GIT_USER_EMAIL"
          git config --global user.name "$GIT_USER_NAME"
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          bash -euo pipefail -c "$RELEASE_COMMAND"
