name: ✅ Self CI

# This repo's own CI. `ci.yml` and `release.yml` are `workflow_call`-only, so
# without this file nothing here runs on a push or a pull request — and the
# Renovate preset automerges devDependency and `magic-*` bumps "once CI is
# green", which with zero checks means immediately.
#
# Two jobs, because they check different things:
#
#   check     the working tree, through the composite action as it is in this
#             commit. This is the gate. It is the only place a change to
#             .github/actions/setup runs before it is tagged.
#   reusable  ci.yml exactly as a consumer calls it. That file references the
#             composite at @v1, so this job checks the *released* pair still
#             works together — the integration a consumer actually gets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 👮 Check (working tree)
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v7

      - name: 🏗 Setup Node + pnpm
        uses: ./.github/actions/setup

      # The same chain `pnpm run check` runs locally, in one step, so the two
      # cannot drift. `validate-rules` needs the build; `check` orders them.
      - name: ✅ Check
        run: pnpm run check

  reusable:
    name: 🛠️ Reusable workflow
    uses: ./.github/workflows/ci.yml
    with:
      build-command: pnpm run build
      test-command: pnpm run test
      # `validate-rules` reads the emitted variant JSON and
      # `validate-observability` walks magic-observability's built module graph,
      # so both have to come after the build. `validate-registry` checks
      # registry.json against the source files and the generated public/r
      # payloads. `smoke` lints fixtures/smoke and asserts on what fires;
      # `adversarial` runs fixtures/adversarial — end-to-end expected-outcome
      # checks for every variant, the opt-in plugin rules and oxfmt.
      extra-command: pnpm run validate-rules && pnpm run validate-observability && pnpm run validate-workflows && pnpm run validate-registry && pnpm run smoke && pnpm run adversarial
