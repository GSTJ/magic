name: 📱 E2E iOS (Maestro)

# Reusable iOS E2E for Expo and bare React Native apps. One macOS job by
# default, because that is what the measurements say:
#
#   jobs:
#     e2e:
#       uses: GSTJ/magic/.github/workflows/e2e-ios.yml@v1
#       with:
#         app-dir: apps/mobile
#
# Everything it does was proved somewhere first. The build settings and the
# cache keys are documented in build-ios-app; the simulator and Maestro
# handling in setup-ios-e2e and run-maestro. What is decided *here* is the job
# topology, and there are only three shapes:
#
#   shards: "0"   one macOS job: build, install, run every flow. The default,
#                 and correct until the flows themselves take minutes.
#   shards: "3"   a build job that publishes the .app, then three matrix jobs
#                 that deal the flows round-robin. Only for independent flows.
#   shards: '[…]' the same, with the flows named per shard. This is what a
#                 stateful suite needs: flows that share a fixture cannot be
#                 split by count, only by which rows they touch.
#
# When *not* to shard, with the arithmetic. A second macOS job costs job setup
# + checkout + the .app download + a second simulator boot, measured at ~3
# minutes, and on a private repo every one of those minutes bills at 10x. Two
# repos measured their flow sets at 165s and 16s of actual execution and both
# kept a single job. Maestro also spends ~60s per invocation starting its
# XCUITest driver, which every shard pays again. Shard when
#
#   flow-seconds / shards + 180 < flow-seconds
#
# i.e. when the flows take more than about 3 minutes per shard you are adding.
# Below that, sharding makes the job slower and (privately) more expensive.
#
# Requires: an Apple Silicon macOS runner. The single-architecture build below
# is only correct because the runner is arm64 — macos-26 and any modern Mac
# are, an Intel image is not.
#
# The check contexts a consumer gets, and which of them can stop a merge:
#
#   🧭 Route          only with hosted-fallback-labels. Advice, never a gate.
#   🚧 Quarantine…    only with quarantine-file. A hard gate, on purpose.
#   <job-name>        the suite, in the unsharded shape.
#   🏗 Build (sharded) + shard (<name>)   the sharded one.
#
# Nothing but the quarantine lint can skip the suite. That is the lesson from
# the round before this one, where routing was a step inside a hard-gating
# preflight job: the repo's Actions billing lapsed, every ubuntu-latest job
# failed on arrival, and the E2E suite stopped running without anyone noticing.

on:
  workflow_call:
    inputs:
      app-dir:
        description: "Directory holding the app — the one with app.json or app.config.*."
        type: string
        required: false
        default: "."
      flows-dir:
        description: "Maestro flow directory, relative to app-dir. Top level only; subflows are not run directly."
        type: string
        required: false
        default: ".maestro"
      flows:
        description: "Explicit flow files, one per line, relative to app-dir. Empty scans flows-dir."
        type: string
        required: false
        default: ""
      build-profile:
        description: >
          release builds the Release configuration with the optimiser off: the JS
          bundle is embedded, so nothing depends on a Metro server, and that is
          what E2E wants. dev-client builds Debug — only pick it if you know the
          app has no expo-dev-client, because with one a Debug build boots the
          dev launcher instead of the app the flows are written against.
        type: string
        required: false
        default: release
      runner-labels:
        description: "JSON array of labels for the macOS jobs."
        type: string
        required: false
        default: '["macos-26"]'
      hosted-fallback-labels:
        description: >
          JSON array to fall back to when runner-labels names a self-hosted
          runner and its heartbeat is stale. Empty disables routing entirely.
        type: string
        required: false
        default: ""
      runner-heartbeat:
        description: >
          Unix timestamp the self-hosted runner last published, normally the
          repo variable MAC_RUNNER_HEARTBEAT. It has to be an input: a called
          workflow cannot read the caller's variables for you. Why a beacon and
          not a live lookup — `gh api repos/{repo}/actions/runners` needs the
          `administration` permission, which GITHUB_TOKEN cannot hold under any
          `permissions:` block. It answers 403 and always will.
        type: string
        required: false
        default: ""
      heartbeat-max-age-seconds:
        description: "How stale the heartbeat may be before the run goes hosted."
        type: number
        required: false
        default: 600
      shards:
        description: >
          "0" for one job. A number for that many round-robin shards. A JSON
          array of {name, flows, soft} to name them — `flows` is a
          comma-separated list of paths relative to app-dir, `soft` opts that
          shard out of gating.
        type: string
        required: false
        default: "0"
      soft-gate-shards:
        description: >
          Default `soft` for shards that do not say. Soft shards report their
          failures in the job summary and as warnings, and still pass. It covers
          flow results only — a build or install failure is infrastructure and
          stays red.
        type: boolean
        required: false
        default: false
      quarantine-file:
        description: >
          Path relative to app-dir of a file of quarantined flow stems. Listed
          flows never run and never fail the build; the file is linted before
          anything else in the DAG, so a stale entry turns the workflow red.
        type: string
        required: false
        default: ""
      quarantine-max-age-days:
        description: "How long a quarantine entry may live before the lint fails."
        type: number
        required: false
        default: 30
      xcode-version:
        description: '"latest", a prefix like "26", or an exact "26.2".'
        type: string
        required: false
        default: latest
      maestro-version:
        description: "Maestro version, pinned and installed at ~/.maestro."
        type: string
        required: false
        default: "2.7.0"
      maestro-sha256:
        description: "Expected SHA-256 for the pinned Maestro release archive."
        type: string
        required: false
        default: ""
      cache-maestro:
        description: >
          auto | true | false. Cache ~/.maestro. auto is true on a GitHub-hosted
          runner and false anywhere else — 332 MB and 3m51 to upload cold, over
          what on a self-hosted Mac is the login user's own install.
        type: string
        required: false
        default: auto
      simulator-device:
        description: "Device name. Empty takes the newest iPhone the chosen runtime supports."
        type: string
        required: false
        default: ""
      simulator-runtime:
        description: 'Runtime prefix, e.g. "iOS 26". Empty takes the newest installed.'
        type: string
        required: false
        default: ""
      reuse-device:
        description: >
          auto | true | false. Keep one dedicated simulator between runs off a
          GitHub-hosted runner, erased before each, instead of creating and
          deleting one per run. Its UDID is in `-destination` and therefore in
          the build description, so a new one every run invalidates the whole
          incremental build — 24s and 4 compile tasks became 69s and 310 on the
          machine this was measured on.
        type: string
        required: false
        default: auto
      device-name:
        description: >
          Name of that dedicated simulator. Give two suites on one machine two
          names, or they take turns erasing each other's device.
        type: string
        required: false
        default: magic-e2e
      checkout-clean:
        description: >
          auto | true | false, passed to actions/checkout's `clean`. auto is
          false off a GitHub-hosted runner and true on one.

          `clean: true` runs `git clean -ffdx`, which deletes every ignored
          file — including the two directories that make a repeat build cheap.
          On a machine that keeps its disk that is pure loss twice over: the
          run pays to restore `ios/` from a cache it already had, and the
          reinstalled `node_modules` makes React Native's codegen re-emit
          `ios/build/generated/**`. That output is byte-for-byte identical and
          carries a new mtime, which is all Xcode needs to recompile
          ReactCodegen and every pod whose headers come from it.

          Left alone, `pnpm install --frozen-lockfile` finishes in under a
          second with "Already up to date" and moves nothing.
        type: string
        required: false
        default: auto
      node-version-file:
        description: "Where the Node version comes from, relative to app-dir."
        type: string
        required: false
        default: ".nvmrc"
      install-command:
        description: "Dependency install. Keep --frozen-lockfile unless you have a reason."
        type: string
        required: false
        default: "pnpm install --frozen-lockfile"
      package-import-method:
        description: >
          pnpm's package-import-method for the install step only, never written
          to an .npmrc. auto is `hardlink` off a GitHub-hosted runner and pnpm's
          own `auto` on one, because cloning gives every file a fresh inode and
          mtime and that is what makes a warm DerivedData recompile everything.
        type: string
        required: false
        default: auto
      prebuild-command:
        description: "Empty for bare React Native repos that commit ios/."
        type: string
        required: false
        default: "pnpm expo prebuild --platform ios --no-install"
      native-cache-paths:
        description: "Globs that decide what prebuild produces, one per line. `<app>` expands to app-dir."
        type: string
        required: false
        default: ""
      build-settings:
        description: "Extra `SETTING=value` xcodebuild arguments, one per line."
        type: string
        required: false
        default: ""
      cache-epoch:
        description: "Bump to invalidate every cache this workflow keeps."
        type: string
        required: false
        default: v1
      cold:
        description: "Ignore every cache. Wire it to a workflow_dispatch input to measure the cold path."
        type: boolean
        required: false
        default: false
      maestro-env:
        description: >
          `KEY=value` lines passed to Maestro as -e. APP_ID is passed for you —
          see app-id — and a line here that sets it wins.
        type: string
        required: false
        default: ""
      app-id:
        description: >
          auto | a bundle id | off. auto passes `-e APP_ID=<the bundle id the
          build produced>`, which is what the Expo templates' flows read as
          `appId: ${APP_ID}`.
        type: string
        required: false
        default: auto
      upload-artifacts:
        description: >
          always | on-failure | never — whether the JUnit report and Maestro's
          debug output are uploaded. on-failure is the default because a green
          run's screenshots are nobody's evidence. Flake statistics need
          `always`: a flaky flow passes some of the time by definition, so a
          history that only keeps the red runs cannot compute a pass rate.
        type: string
        required: false
        default: on-failure
      deep-link:
        description: >
          URL opened on the device after install and before the flows. The
          generic form of E2E auth-token injection: mint a token, encode it into
          your app's scheme, and no flow has to drive a WebView login.
        type: string
        required: false
        default: ""
      retries:
        description: "Extra attempts per Maestro invocation. A real regression fails across all of them."
        type: number
        required: false
        default: 1
      per-flow:
        description: "One `maestro test` per flow. Off keeps them in one invocation, preserving flowsOrder."
        type: boolean
        required: false
        default: false
      env-file-contents:
        description: "Written to app-dir/.env before the build, for repos whose config reads one."
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: "Timeout for the macOS build job."
        type: number
        required: false
        default: 60
      flow-timeout-minutes:
        description: "Timeout for a sharded flow job."
        type: number
        required: false
        default: 30
      job-name:
        description: "Second half of the required-check context the single-job shape reports as."
        type: string
        required: false
        default: "🧪 Maestro iOS"
    secrets:
      NPM_TOKEN:
        description: "Only when the install needs a private registry."
        required: false
    outputs:
      result:
        description: pass | fail | skipped, from the unsharded job.
        value: ${{ jobs.e2e.outputs.result }}

permissions:
  contents: read

env:
  MAESTRO_CLI_NO_ANALYTICS: "1"

jobs:
  # Two Ubuntu jobs where there used to be one, because they answer to different
  # authorities and one of them was taking the suite down with it.
  #
  # Routing is advice. If it cannot run — and on a repo whose Actions billing has
  # lapsed, no ubuntu-latest job can — the right answer is "use runner-labels",
  # not "skip the E2E suite". As one job with a hard gate it was the second:
  # `route` failed on arrival, `e2e` refused to start, and the suite silently
  # stopped running (measured, would-you-rather run 30324571838). It is now its
  # own job with continue-on-error, and every consumer reads its output as
  # `needs.route.outputs.labels || inputs.runner-labels`, so a router that never
  # ran costs nothing.
  #
  # The quarantine lint is a gate. A stale quarantine entry has to stop the
  # merge, so it stays hard — and it only exists when quarantine-file is set,
  # which is the repo saying it wants one.
  #
  # The shard plan left Ubuntu entirely: it reads one input string, it belongs
  # to the sharded shape alone, and running it as the first step of the build
  # job puts it on the runner that was going to be used anyway. A bad `shards`
  # input still fails in seconds, before the checkout.
  route:
    name: 🧭 Route
    if: inputs.hosted-fallback-labels != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Advice, not a gate. Downstream jobs carry `!cancelled()` so a failure here
    # cannot skip them, and fall back to runner-labels when the output is empty.
    continue-on-error: true
    outputs:
      labels: ${{ steps.route.outputs.labels }}
    steps:
      # The beacon, not a live lookup. A self-hosted Mac publishes a timestamp
      # to a repo variable from a timer that has already confirmed the runner is
      # listening; a stale one means asleep, offline or dead, and the run goes
      # hosted. Repo variables are readable for free and hold nothing secret.
      - name: 🧭 Route
        id: route
        env:
          IN_LABELS: ${{ inputs.runner-labels }}
          IN_FALLBACK: ${{ inputs.hosted-fallback-labels }}
          IN_HEARTBEAT: ${{ inputs.runner-heartbeat }}
          IN_MAX_AGE: ${{ inputs.heartbeat-max-age-seconds }}
        run: |
          set -euo pipefail
          labels="$IN_LABELS"
          verdict="🏷 $labels"
          if [ -z "$IN_HEARTBEAT" ]; then
            labels="$IN_FALLBACK"
            verdict="☁️ $labels — no heartbeat published"
          else
            age=$(( $(date -u +%s) - IN_HEARTBEAT ))
            if [ "$age" -ge 0 ] && [ "$age" -lt "$IN_MAX_AGE" ]; then
              verdict="🖥️ $labels — heartbeat ${age}s old"
            else
              labels="$IN_FALLBACK"
              verdict="☁️ $labels — heartbeat stale (${age}s)"
            fi
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "$verdict"
          echo "$verdict" >> "$GITHUB_STEP_SUMMARY"

  quarantine:
    name: 🚧 Quarantine lint
    if: inputs.quarantine-file != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A quarantine entry is a borrowing facility with a maturity date. The
      # lint is what makes it one: three fields, and an age. Past the age
      # nothing merges to this path until somebody fixes the flow or moves it to
      # a soft-gated shard. Without the decay rule a quarantine file is just a
      # list of tests that stopped mattering.
      - name: 🚧 Lint the quarantine file
        env:
          IN_APP_DIR: ${{ inputs.app-dir }}
          IN_QUARANTINE_FILE: ${{ inputs.quarantine-file }}
          IN_MAX_AGE_DAYS: ${{ inputs.quarantine-max-age-days }}
        run: |
          set -euo pipefail
          file="${IN_APP_DIR%/}/$IN_QUARANTINE_FILE"
          file="${file#./}"
          if [ ! -f "$file" ]; then
            echo "::error::quarantine-file '$file' does not exist. Create it, or unset the input."
            exit 1
          fi

          now=$(date -u +%s)
          failures=0
          entries=0
          line_number=0
          while IFS= read -r raw || [ -n "$raw" ]; do
            line_number=$((line_number + 1))
            stem=$(printf '%s' "$raw" | sed 's/#.*//' | awk 'NF {print $1}')
            [ -n "$stem" ] || continue
            entries=$((entries + 1))
            case "$raw" in
              *"#"*) note="${raw#*#}" ;;
              *) note="" ;;
            esac

            for field in reason owner added; do
              case "$note" in
                *"$field:"*) ;;
                *)
                  echo "::error file=$file,line=$line_number::$stem is missing '$field:'. The format is: <flow-stem>  # reason: <text>; owner: @handle; added: YYYY-MM-DD"
                  failures=$((failures + 1))
                  ;;
              esac
            done

            added=$(printf '%s' "$note" | sed -n 's/.*added:[[:space:]]*\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\).*/\1/p')
            if [ -z "$added" ]; then
              echo "::error file=$file,line=$line_number::$stem has no parseable 'added: YYYY-MM-DD'."
              failures=$((failures + 1))
              continue
            fi
            if ! added_at=$(date -u -d "$added" +%s 2>/dev/null); then
              echo "::error file=$file,line=$line_number::$stem has an invalid date '$added'."
              failures=$((failures + 1))
              continue
            fi
            age=$(((now - added_at) / 86400))
            if [ "$age" -gt "$IN_MAX_AGE_DAYS" ]; then
              echo "::error file=$file,line=$line_number::$stem has been quarantined for $age days (max $IN_MAX_AGE_DAYS). Fix the flow, delete the entry, or move it to a soft-gated shard."
              failures=$((failures + 1))
            else
              echo "$stem — quarantined $age of $IN_MAX_AGE_DAYS days"
            fi
          done < "$file"

          echo "$entries quarantined flow(s), $failures problem(s)."
          [ "$failures" -eq 0 ]

  # The default shape. Build and flows in one job, because the .app never leaves
  # the runner and the simulator boots once.
  e2e:
    name: ${{ inputs.job-name }}
    needs: [route, quarantine]
    # `!cancelled()` first, so a skipped or failed `route` cannot skip this job —
    # that is the whole point of moving routing out. `quarantine` is the gate,
    # and `!= 'failure'` lets it be skipped (no quarantine-file) without taking
    # the suite with it.
    if: ${{ !cancelled() && needs.quarantine.result != 'failure' && inputs.shards == '0' }}
    runs-on: ${{ fromJSON(needs.route.outputs.labels || inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: magic-e2e-ios-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      result: ${{ steps.maestro.outputs.result }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # See checkout-clean: `git clean -ffdx` deletes node_modules and
          # ios/, which is what makes the caches below buy nothing.
          clean: ${{ inputs.checkout-clean == 'true' || (inputs.checkout-clean == 'auto' && runner.environment == 'github-hosted') }}

      # Referenced by owner/repo, never `./`: inside a called workflow a `./`
      # path resolves against the caller's checkout.
      - name: 🏗 Setup Node + pnpm
        uses: GSTJ/magic/.github/actions/setup@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          working-directory: ${{ inputs.app-dir }}
          node-version-file: ${{ inputs.node-version-file }}
          install-command: ${{ inputs.install-command }}
          package-import-method: ${{ inputs.package-import-method }}
          registry-url: ${{ secrets.NPM_TOKEN != '' && 'https://registry.npmjs.org' || '' }}
          node-auth-token: ${{ secrets.NPM_TOKEN }}

      - name: 🔧 Write .env
        if: inputs.env-file-contents != ''
        working-directory: ${{ inputs.app-dir }}
        env:
          CONTENTS: ${{ inputs.env-file-contents }}
        run: printf '%s\n' "$CONTENTS" > .env

      # boot: false — this starts the boot and nothing waits for it here, so it
      # overlaps the compile below. run-maestro does the bounded wait.
      - name: 🍎 Setup Xcode, Maestro and the simulator
        id: ios
        uses: GSTJ/magic/.github/actions/setup-ios-e2e@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          xcode-version: ${{ inputs.xcode-version }}
          maestro-version: ${{ inputs.maestro-version }}
          maestro-sha256: ${{ inputs.maestro-sha256 }}
          cache-maestro: ${{ inputs.cache-maestro }}
          simulator-device: ${{ inputs.simulator-device }}
          simulator-runtime: ${{ inputs.simulator-runtime }}
          reuse-device: ${{ inputs.reuse-device }}
          device-name: ${{ inputs.device-name }}
          working-directory: ${{ inputs.app-dir }}
          boot: "false"
          install-cocoapods: auto
          # build-ios-app owns DerivedData; two actions caching it under
          # different keys is how a cache serves the wrong tree.
          cache-derived-data: "false"

      - name: 🏗 Build for the simulator
        id: build
        uses: GSTJ/magic/.github/actions/build-ios-app@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          app-dir: ${{ inputs.app-dir }}
          configuration: ${{ inputs.build-profile == 'dev-client' && 'Debug' || 'Release' }}
          udid: ${{ steps.ios.outputs.udid }}
          prebuild-command: ${{ inputs.prebuild-command }}
          native-cache-paths: ${{ inputs.native-cache-paths }}
          build-settings: ${{ inputs.build-settings }}
          cache-epoch: ${{ inputs.cache-epoch }}
          cold: ${{ inputs.cold }}

      - name: 🎬 Maestro
        id: maestro
        uses: GSTJ/magic/.github/actions/run-maestro@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          udid: ${{ steps.ios.outputs.udid }}
          app-path: ${{ steps.build.outputs.app-path }}
          bundle-id: ${{ steps.build.outputs.bundle-id }}
          working-directory: ${{ inputs.app-dir }}
          flows: ${{ inputs.flows }}
          flows-dir: ${{ inputs.flows-dir }}
          quarantine-file: ${{ inputs.quarantine-file }}
          per-flow: ${{ inputs.per-flow }}
          retries: ${{ inputs.retries }}
          deep-link: ${{ inputs.deep-link }}
          maestro-env: ${{ inputs.maestro-env }}
          app-id: ${{ inputs.app-id }}
          upload-artifacts: ${{ inputs.upload-artifacts }}
          name: maestro-ios

      - name: 🧹 Remove the created simulator
        if: always() && steps.ios.outputs.created == 'true'
        env:
          UDID: ${{ steps.ios.outputs.udid }}
        run: |
          set -euo pipefail
          [ -n "${UDID:-}" ] || exit 0
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl delete "$UDID" 2>/dev/null || true
          echo "Deleted $UDID"

  # The sharded shape. One build, published once, consumed by every shard.
  build:
    name: 🏗 Build (sharded)
    needs: [route, quarantine]
    if: ${{ !cancelled() && needs.quarantine.result != 'failure' && inputs.shards != '0' }}
    runs-on: ${{ fromJSON(needs.route.outputs.labels || inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: magic-e2e-ios-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      bundle-id: ${{ steps.build.outputs.bundle-id }}
      shard-plan: ${{ steps.shards.outputs.plan }}
      shard-names: ${{ steps.shards.outputs.names }}
    steps:
      # First, before the checkout: it reads one input string and nothing else,
      # so a malformed `shards` fails in seconds rather than after a build. It
      # runs here rather than on Ubuntu because this job's runner is the one the
      # matrix will use anyway, and a plan step that cannot run when hosted
      # billing is broken is a suite that cannot run either.
      - name: 🧮 Plan the shards
        id: shards
        env:
          IN_SHARDS: ${{ inputs.shards }}
          IN_SOFT: ${{ inputs.soft-gate-shards }}
        run: |
          set -euo pipefail
          # python3, not node: this step runs before Setup Node so that a
          # malformed input costs nothing, and every macOS runner has python3
          # while a self-hosted one may not have a node on PATH yet.
          python3 - > "$RUNNER_TEMP/shard-plan.txt" <<'PY'
          import json, os, re

          raw = (os.environ.get("IN_SHARDS") or "").strip()
          soft = os.environ.get("IN_SOFT") == "true"

          if re.fullmatch(r"\d+", raw):
              total = int(raw)
              if total < 1:
                  raise SystemExit(f'shards must be "0" or >= 1, got {raw}')
              entries = [
                  {
                      "name": f"shard-{index + 1}-of-{total}",
                      "flows": "",
                      "index": str(index),
                      "total": str(total),
                      "soft": str(soft).lower(),
                  }
                  for index in range(total)
              ]
          else:
              parsed = json.loads(raw)
              if not isinstance(parsed, list) or not parsed:
                  raise SystemExit("shards must be a count or a non-empty JSON array")
              entries = []
              for index, shard in enumerate(parsed):
                  if not isinstance(shard, dict):
                      raise SystemExit(f"shard {index} is not an object")
                  if not shard.get("flows"):
                      raise SystemExit(f"shard {index} has no flows")
                  entries.append(
                      {
                          "name": str(shard.get("name") or f"shard-{index + 1}"),
                          # Commas are what a YAML author reaches for; the
                          # action takes one path per line.
                          "flows": "\n".join(
                              part.strip()
                              for part in str(shard["flows"]).split(",")
                              if part.strip()
                          ),
                          "index": "",
                          "total": "",
                          "soft": str(shard.get("soft", soft)).lower(),
                      }
                  )

          names = [entry["name"] for entry in entries]
          if len(set(names)) != len(names):
              raise SystemExit("shard names must be unique")
          # The matrix carries the names alone, so GitHub's own job naming
          # renders `shard (core)` — see the note on the shard job.
          print(json.dumps(entries))
          print(json.dumps(names))
          PY
          { read -r plan; read -r names; } < "$RUNNER_TEMP/shard-plan.txt"
          # printf, not echo: a named shard's flows are a JSON string holding
          # \n, and there are shells whose echo would turn that into a newline
          # and split the output line in half.
          printf 'plan=%s\nnames=%s\n' "$plan" "$names" >> "$GITHUB_OUTPUT"
          {
            echo "### Shards"
            echo ""
            echo '```json'
            printf '%s\n' "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # See checkout-clean: `git clean -ffdx` deletes node_modules and
          # ios/, which is what makes the caches below buy nothing.
          clean: ${{ inputs.checkout-clean == 'true' || (inputs.checkout-clean == 'auto' && runner.environment == 'github-hosted') }}

      - name: 🏗 Setup Node + pnpm
        uses: GSTJ/magic/.github/actions/setup@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          working-directory: ${{ inputs.app-dir }}
          node-version-file: ${{ inputs.node-version-file }}
          install-command: ${{ inputs.install-command }}
          package-import-method: ${{ inputs.package-import-method }}
          registry-url: ${{ secrets.NPM_TOKEN != '' && 'https://registry.npmjs.org' || '' }}
          node-auth-token: ${{ secrets.NPM_TOKEN }}

      - name: 🔧 Write .env
        if: inputs.env-file-contents != ''
        working-directory: ${{ inputs.app-dir }}
        env:
          CONTENTS: ${{ inputs.env-file-contents }}
        run: printf '%s\n' "$CONTENTS" > .env

      # No Maestro and no boot in this job: it only produces the .app. A
      # simulator is still selected, because naming the device is what tells
      # actool which runtime to thin assets for.
      - name: 🍎 Setup Xcode and the simulator
        id: ios
        uses: GSTJ/magic/.github/actions/setup-ios-e2e@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          xcode-version: ${{ inputs.xcode-version }}
          maestro-version: ${{ inputs.maestro-version }}
          maestro-sha256: ${{ inputs.maestro-sha256 }}
          simulator-device: ${{ inputs.simulator-device }}
          simulator-runtime: ${{ inputs.simulator-runtime }}
          reuse-device: ${{ inputs.reuse-device }}
          device-name: ${{ inputs.device-name }}
          working-directory: ${{ inputs.app-dir }}
          boot: "false"
          create-device: "false"
          cache-derived-data: "false"

      - name: 🏗 Build for the simulator
        id: build
        uses: GSTJ/magic/.github/actions/build-ios-app@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          app-dir: ${{ inputs.app-dir }}
          configuration: ${{ inputs.build-profile == 'dev-client' && 'Debug' || 'Release' }}
          udid: ${{ steps.ios.outputs.udid }}
          prebuild-command: ${{ inputs.prebuild-command }}
          native-cache-paths: ${{ inputs.native-cache-paths }}
          build-settings: ${{ inputs.build-settings }}
          cache-epoch: ${{ inputs.cache-epoch }}
          cold: ${{ inputs.cold }}

      # tar, not a raw upload: a .app is a directory of symlinks and executable
      # bits, and upload-artifact preserves neither.
      - name: 📦 Publish the .app
        env:
          APP_PATH: ${{ steps.build.outputs.app-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magic-app"
          tar -C "$(dirname "$APP_PATH")" -czf "$RUNNER_TEMP/magic-app/app.tgz" "$(basename "$APP_PATH")"
          ls -lh "$RUNNER_TEMP/magic-app/app.tgz"

      - name: 📤 Upload the .app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: magic-ios-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magic-app/app.tgz
          retention-days: 1

  # Deliberately unnamed. A `name:` holding a matrix expression is rendered
  # *literally* when the job is skipped — the unsharded shape, i.e. the default —
  # so every consumer of this workflow carried a check called
  # `🧪 ${{ matrix.shard.name }}` in its PR list. GitHub's own naming has no such
  # problem: with no `name:` the job is `shard (core)` when the matrix expands
  # and plain `shard` when it does not. That is also why the matrix vector is the
  # bare shard *name* and the rest of the plan is looked up in a step below —
  # an object in the vector would be serialised into the job name whole.
  shard:
    needs: [route, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.labels || inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.flow-timeout-minutes }}
    strategy:
      # One shard's failure must not cancel its siblings: the point of the run
      # is the whole picture, and a cancelled sibling reports as neither.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shard-names) }}
    concurrency:
      group: magic-e2e-ios-${{ github.workflow }}-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - name: 🧮 Resolve this shard
        id: plan
        env:
          PLAN: ${{ needs.build.outputs.shard-plan }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os

          want = os.environ["SHARD"]
          plan = json.loads(os.environ["PLAN"])
          entry = next((shard for shard in plan if shard["name"] == want), None)
          if entry is None:
              raise SystemExit(f"no shard named {want!r} in the plan")

          # flows is a list, so it goes out as a heredoc. The delimiter cannot
          # occur in a flow path, which is all GITHUB_OUTPUT asks of it.
          print(f"flows<<MAGIC_SHARD_FLOWS\n{entry['flows']}\nMAGIC_SHARD_FLOWS")
          print(f"index={entry['index']}")
          print(f"total={entry['total']}")
          print(f"soft={entry['soft']}")
          PY

      - name: 🏗 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # See checkout-clean: `git clean -ffdx` deletes node_modules and
          # ios/, which is what makes the caches below buy nothing.
          clean: ${{ inputs.checkout-clean == 'true' || (inputs.checkout-clean == 'auto' && runner.environment == 'github-hosted') }}

      - name: 📥 Download the .app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: magic-ios-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magic-app

      - name: 📦 Unpack the .app
        id: app
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/magic-app/unpacked"
          mkdir -p "$dest"
          tar -C "$dest" -xzf "$RUNNER_TEMP/magic-app/app.tgz"
          # A file and `read`, never `find | head -1`: head closes the pipe on
          # the line it wanted and pipefail turns the writer's SIGPIPE into this
          # step's exit code. See the note in build-ios-app.
          find "$dest" -maxdepth 1 -name "*.app" > "$RUNNER_TEMP/unpacked-apps.txt" 2>/dev/null || true
          app_path=""
          read -r app_path < "$RUNNER_TEMP/unpacked-apps.txt" || true
          if [ -z "$app_path" ]; then
            echo "::error::No .app in the published artifact."
            exit 1
          fi
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      # boot: true here — there is no compile in this job to overlap with, so
      # the wait may as well happen up front where the bound is enforced.
      - name: 🍎 Setup Maestro and the simulator
        id: ios
        uses: GSTJ/magic/.github/actions/setup-ios-e2e@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          xcode-version: ${{ inputs.xcode-version }}
          maestro-version: ${{ inputs.maestro-version }}
          maestro-sha256: ${{ inputs.maestro-sha256 }}
          cache-maestro: ${{ inputs.cache-maestro }}
          simulator-device: ${{ inputs.simulator-device }}
          simulator-runtime: ${{ inputs.simulator-runtime }}
          reuse-device: ${{ inputs.reuse-device }}
          device-name: ${{ inputs.device-name }}
          working-directory: ${{ inputs.app-dir }}
          boot: "true"
          install-cocoapods: "false"
          cache-pods: "false"
          cache-derived-data: "false"

      - name: 🎬 Maestro
        id: maestro
        uses: GSTJ/magic/.github/actions/run-maestro@aa331e83282c2794edd474646c671f036dfabee0 # v1.12.1
        with:
          udid: ${{ steps.ios.outputs.udid }}
          app-path: ${{ steps.app.outputs.path }}
          bundle-id: ${{ needs.build.outputs.bundle-id }}
          working-directory: ${{ inputs.app-dir }}
          # A named shard brings its own list. A counted one brings none, and
          # then the workflow-level list (or flows-dir) is what gets sliced.
          flows: ${{ steps.plan.outputs.flows != '' && steps.plan.outputs.flows || inputs.flows }}
          flows-dir: ${{ inputs.flows-dir }}
          shard-index: ${{ steps.plan.outputs.index }}
          shard-total: ${{ steps.plan.outputs.total }}
          quarantine-file: ${{ inputs.quarantine-file }}
          per-flow: ${{ inputs.per-flow }}
          retries: ${{ inputs.retries }}
          deep-link: ${{ inputs.deep-link }}
          maestro-env: ${{ inputs.maestro-env }}
          app-id: ${{ inputs.app-id }}
          upload-artifacts: ${{ inputs.upload-artifacts }}
          # Soft-gating lives here rather than in a job-level
          # continue-on-error, which reports a red run as green to PR checks —
          # one repo shipped three failing runs as successes that way.
          soft-fail: ${{ steps.plan.outputs.soft }}
          name: ${{ matrix.shard }}

      - name: 🧹 Remove the created simulator
        if: always() && steps.ios.outputs.created == 'true'
        env:
          UDID: ${{ steps.ios.outputs.udid }}
        run: |
          set -euo pipefail
          [ -n "${UDID:-}" ] || exit 0
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl delete "$UDID" 2>/dev/null || true
          echo "Deleted $UDID"
