name: 🛠️ CI

# Reusable checkup workflow. Every GSTJ repo calls this instead of copy-pasting
# a lint/format/typecheck job.
#
#   jobs:
#     ci:
#       uses: GSTJ/magic/.github/workflows/ci.yml@v1
#
# Call it by tag, never by branch. `@v1` is a moving major tag, so a fix lands
# everywhere on the next run; `@v1.3.0` pins exactly and lets Renovate open the
# bump PR. `@main` gets you whatever was merged five minutes ago.
#
# This repo is public, so private repos can call it too.
#
# The required-check name a called workflow reports is always
# `<caller job> / <called job>`, so it can never be a bare context. Set
# `job-name` when a ruleset needs a particular second half.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version. Defaults to reading .nvmrc from the caller repo."
        type: string
        required: false
        default: ""
      node-version-file:
        description: "Where the Node version comes from when node-version is empty."
        type: string
        required: false
        default: ".nvmrc"
      pnpm-version:
        description: "pnpm version. Empty means take it from the caller's packageManager field."
        type: string
        required: false
        default: ""
      working-directory:
        description: "Directory to run every step in."
        type: string
        required: false
        default: "."
      install-command:
        type: string
        required: false
        default: "pnpm install --frozen-lockfile"
      lint-command:
        description: "Set to an empty string to skip linting."
        type: string
        required: false
        default: "pnpm run lint"
      format-command:
        description: "Set to an empty string to skip the format check."
        type: string
        required: false
        default: "pnpm run format"
      typecheck-command:
        description: "Set to an empty string to skip typechecking."
        type: string
        required: false
        default: "pnpm run typecheck"
      test-command:
        description: "Empty by default — opt in per repo."
        type: string
        required: false
        default: ""
      build-command:
        description: "Empty by default — opt in per repo."
        type: string
        required: false
        default: ""
      extra-command:
        description: "Escape hatch for repo-specific gates (expo doctor, invariant scripts, ...)."
        type: string
        required: false
        default: ""
      turbo-cache:
        description: "Enable the GitHub Actions cache backend for turbo."
        type: boolean
        required: false
        default: true
      job-name:
        description: "Second half of the required-check context this workflow reports as."
        type: string
        required: false
        default: "👮 Lint, Format, Typecheck"
      runs-on:
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      NPM_TOKEN:
        description: "Optional. Pass it only when the install needs a private registry — it is what switches registry-url on."
        required: false

jobs:
  checkup:
    name: ${{ inputs.job-name }}
    # Job-level on purpose: GitHub ignores workflow-level `concurrency` in a
    # workflow that only ever runs via `workflow_call` — it applies to workflow
    # *runs*, and this file never runs standalone. At the job level it takes
    # effect inside the caller's run.
    concurrency:
      group: magic-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v7

      # Referenced by owner/repo, not `./`: inside a called workflow a `./` path
      # resolves against the *caller's* checkout, so `./.github/actions/setup`
      # would look for the action in the consumer's repo and fail there.
      - name: 🏗 Setup Node + pnpm
        uses: GSTJ/magic/.github/actions/setup@v1
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          pnpm-version: ${{ inputs.pnpm-version }}
          working-directory: ${{ inputs.working-directory }}
          install-command: ${{ inputs.install-command }}
          turbo-cache: ${{ inputs.turbo-cache }}
          # Only written when there is a token to put in it. Setting it
          # unconditionally leaves an .npmrc holding a literal
          # ${NODE_AUTH_TOKEN}, which the package-manager probes behind `cache:`
          # choke on — one consumer already had to work around exactly that.
          registry-url: ${{ secrets.NPM_TOKEN != '' && 'https://registry.npmjs.org' || '' }}
          node-auth-token: ${{ secrets.NPM_TOKEN }}

      - name: 🏗 Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: 🧹 Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: 💅 Format
        if: inputs.format-command != ''
        run: ${{ inputs.format-command }}

      - name: 🧪 Typecheck
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}

      - name: 🧪 Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: 🧰 Extra checks
        if: inputs.extra-command != ''
        run: ${{ inputs.extra-command }}
