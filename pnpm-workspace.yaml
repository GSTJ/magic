packages:
  - "packages/*"
  - "fixtures/*"
# `posthog-js` pulls in core-js, whose postinstall script only prints a funding
# banner. Denied, so `pnpm install` stops asking and CI stays quiet.
allowBuilds:
  core-js: false
# Supply-chain quarantine: don't resolve to versions published in the last
# 3 days. The excludes are packages vetted by hand while inside the window:
# safe-jsx 1.3.0 (see DECISIONS.md) and turbo 2.10.7 (pinned in the lockfile,
# published 2026-07-25).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - eslint-plugin-safe-jsx@1.3.0
  - turbo@2.10.7
  - "@turbo/*"
# The two JS plugins `magic-oxlint-config` bundles declare a **required**
# `eslint` peer that nothing ever calls — oxlint loads them through its own
# jsPlugin host. `autoInstallPeers` honours the peer anyway and drags in eslint
# 9, which is where the unpatchable `minimatch@3 -> brace-expansion@1` tail
# comes from. Marking the peer optional is the fix DECISIONS.md §4 wants made
# upstream; until those two packages ship it, do it here. `peerDependencyRules:
# ignoreMissing` does NOT do this — it only silences the warning.
packageExtensions:
  eslint-plugin-safe-jsx:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-react-native:
    peerDependenciesMeta:
      eslint:
        optional: true
