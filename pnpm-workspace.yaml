packages:
  - "packages/*"
  - "apps/*"
  - "fixtures/*"
# `magic-docs` hands the docs site React components it imported from its own
# copy of Fumadocs. Two copies means two `FrameworkContext` objects, the app's
# provider fills neither of the other's, and every `Link` inside MDX silently
# degrades to a bare `<a>` that Next never prefixes with `basePath`. Matching
# version strings is not enough, a Renovate bump on one side reopens it, so
# both sides resolve the same catalog entry.
catalog:
  fumadocs-core: 16.14.0
  fumadocs-ui: npm:@fumadocs/base-ui@16.14.0
# `posthog-js` pulls in core-js, whose postinstall script only prints a funding
# banner. Denied, so `pnpm install` stops asking and CI stays quiet.
allowBuilds:
  core-js: false
  # packages/video pulls esbuild in through @remotion/cli. Its postinstall
  # fetches/validates the platform binary; blocked, Remotion's bundler breaks.
  esbuild: true
# magic is the first-party exception to the shared 14-day supply-chain
# quarantine. Its own dependency updates may resolve immediately; consumers
# still inherit the 14-day floor from default.json and their workspace policy.
minimumReleaseAge: 0
# `eslint-plugin-safe-jsx@1.3.0` — the version this lockfile is on — declares a
# **required** `eslint` peer that nothing ever calls, because oxlint loads the
# plugin through its own jsPlugin host. `autoInstallPeers` honours the peer
# anyway and drags in eslint, which is where the unpatchable
# `minimatch@3 -> brace-expansion@1` tail used to come from. Marking the peer
# optional is the fix. `peerDependencyRules: ignoreMissing` does NOT do this —
# it only silences the warning.
#
# Upstream shipped the same fix in `eslint-plugin-safe-jsx@1.3.2`, so this
# stanza is a floor-raise away from being deletable; it stays until the lockfile
# moves onto that version.
#
# The matching `eslint-plugin-react-native` entry is gone with the dependency:
# those four rules are now `magic-oxlint-plugin/react-native`, which has no
# dependencies at all.
packageExtensions:
  eslint-plugin-safe-jsx:
    peerDependenciesMeta:
      eslint:
        optional: true
