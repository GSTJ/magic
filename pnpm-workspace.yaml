packages:
  - "packages/*"
  - "fixtures/*"
# `posthog-js` pulls in core-js, whose postinstall script only prints a funding
# banner. Denied, so `pnpm install` stops asking and CI stays quiet.
allowBuilds:
  core-js: false
# Supply-chain quarantine: don't resolve to versions published in the last
# 3 days. The excludes are packages vetted by hand while inside the window:
# safe-jsx 1.3.5 (the first release carrying the optional `eslint` peer that
# this round depends on; read below) and turbo 2.10.7 (pinned in the lockfile,
# published 2026-07-25).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - eslint-plugin-safe-jsx@1.3.5
  - turbo@2.10.7
  - "@turbo/*"
# No `packageExtensions` block any more, and that is the point of this round.
#
# Both JS plugins `magic-oxlint-config` depended on used to declare a
# **required** `eslint` peer that nothing ever calls, because oxlint loads them
# through its own jsPlugin host. `autoInstallPeers` honoured the peer anyway and
# dragged in eslint, which is where the unpatchable
# `minimatch@3 -> brace-expansion@1` tail came from. Marking the peer optional
# here fixed it for this repo and for nobody else, since `packageExtensions` is
# per-repo and every consumer had to paste the same stanza.
#
# Both halves are fixed at the source now. `eslint-plugin-react-native` is gone
# with the dependency — those four rules are `magic-oxlint-plugin/react-native`,
# which has no dependencies at all. `eslint-plugin-safe-jsx` ships the optional
# peer as of 1.3.2, and the floor above is `^1.3.3` so a consumer cannot resolve
# back onto a version that does not.
#
# `peerDependencyRules: ignoreMissing` was never the answer to any of this: on
# pnpm 11.17.0 it only silences the missing-peer warning and installs eslint
# regardless, byte-identical lockfile with the stanza and without it.
